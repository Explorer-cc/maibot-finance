services:
  core:
    image: ${MAIBOT_IMAGE}
    container_name: maibot-core
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      EULA_AGREE: ${MAIBOT_EULA_AGREE}
      PRIVACY_AGREE: ${MAIBOT_PRIVACY_AGREE}
      MAIBOT_LEGACY_0X_UPGRADE_CONFIRMED: "1"
      MAIBOT_STATISTICS_REPORT_PATH: /MaiMBot/data/maibot_statistics.html
      WEBUI_HOST: 0.0.0.0
      UV_DEFAULT_INDEX: https://pypi.org/simple
    ports:
      - "127.0.0.1:${WEBUI_PORT}:8001"
    volumes:
      - ./runtime/core-config:/MaiMBot/config
      - ./runtime/data/MaiMBot:/MaiMBot/data
      - ./runtime/data/MaiMBot/emoji:/data/emoji
      - ./runtime/data/MaiMBot/plugins:/MaiMBot/plugins
      - ./runtime/data/MaiMBot/logs:/MaiMBot/logs
      - ./runtime/depends-data:/MaiMBot/depends-data
    networks:
      - maibot
    mem_limit: 1024m
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/webui/health', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  napcat:
    image: ${NAPCAT_IMAGE}
    container_name: maibot-napcat
    profiles: ["napcat"]
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      NAPCAT_UID: "1000"
      NAPCAT_GID: "1000"
    ports:
      - "127.0.0.1:${NAPCAT_WEBUI_PORT}:6099"
    volumes:
      - ./runtime/napcat-config:/app/napcat/config
      - ./runtime/data/qq:/app/.config/QQ
      - ./runtime/data/MaiMBot:/MaiMBot/data
    networks:
      - maibot
    mem_limit: 384m
    pids_limit: 256
    logging:
      driver: "none"

  snowluma:
    image: ${SNOWLUMA_IMAGE}
    container_name: maibot-snowluma
    profiles: ["snowluma"]
    restart: unless-stopped
    shm_size: 1g
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    environment:
      TZ: Asia/Shanghai
      VNC_PASSWD: ${SNOWLUMA_VNC_PASSWORD}
      SNOWLUMA_UID: "1000"
      SNOWLUMA_GID: "1000"
      SNOWLUMA_WEBUI_HOST: 0.0.0.0
      SNOWLUMA_WEBUI_PORT: 5099
      SNOWLUMA_HOOK_AUTOLOAD: "1"
      SNOWLUMA_QQ_FLAGS: --disable-gpu --disable-software-rasterizer --disable-gpu-compositing
      SNOWLUMA_ACCEPT_EULA: ${SNOWLUMA_ACCEPT_EULA}
      SNOWLUMA_ACCEPT_PRIVACY: ${SNOWLUMA_ACCEPT_PRIVACY}
    ports:
      - "127.0.0.1:${SNOWLUMA_WEBUI_PORT}:5099"
      - "127.0.0.1:${SNOWLUMA_NOVNC_PORT}:6081"
    volumes:
      - ./runtime/snowluma/data:/app/data
      - ./runtime/snowluma/qq-config:/app/.config
      - ./runtime/snowluma/qq-local-share:/app/.local/share
    networks:
      - maibot
    mem_limit: 1536m
    pids_limit: 512

  sqlite-web:
    image: ${SQLITE_WEB_IMAGE}
    container_name: maibot-sqlite-web
    profiles: ["admin"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SQLITE_WEB_PORT}:8080"
    volumes:
      - ./runtime/data/MaiMBot:/data/MaiMBot:ro
    environment:
      SQLITE_DATABASE: MaiMBot/MaiBot.db
    networks:
      - maibot
    mem_limit: 128m
    pids_limit: 64

  public-maibot-admin:
    image: ${CADDY_IMAGE:-caddy@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d}
    container_name: maibot-public-maibot-admin
    profiles: ["public-admin"]
    restart: unless-stopped
    environment:
      MAIBOT_ADMIN_USER: ${MAIBOT_ADMIN_USER:-CHANGE_ME}
      MAIBOT_ADMIN_PASSWORD_HASH: ${MAIBOT_ADMIN_PASSWORD_HASH:-CHANGE_ME}
    ports:
      - "${PUBLIC_HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/Caddyfile.maibot:/etc/caddy/Caddyfile:ro
      - ./runtime/caddy-maibot/data:/data
      - ./runtime/caddy-maibot/config:/config
    networks:
      - maibot
    mem_limit: 128m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  maibot:
    driver: bridge
